<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
<div class="overlay container mt-4">

<h2 class="text-center text-white">📊 Dashboard</h2>

<!-- 🔥 POWER BI -->
<div class="card p-3 mb-4">
<h4>Power BI Report</h4>

<!-- PASTE YOUR POWER BI EMBED LINK BELOW -->
<iframe width="100%" height="400"
src="https://app.powerbi.com/view?r=YOUR_LINK_HERE"
frameborder="0" allowFullScreen="true"></iframe>

</div>

<!-- 📈 ACCURACY CARDS -->
<div class="row text-center mb-4">

<div class="col-md-3">
<div class="card bg-light">
<h5>Logistic Regression</h5>
<p>Accuracy: 87%</p>
</div>
</div>

<div class="col-md-3">
<div class="card bg-light">
<h5>Random Forest</h5>
<p>Accuracy: 92%</p>
</div>
</div>

<div class="col-md-3">
<div class="card bg-light">
<h5>SVM</h5>
<p>Accuracy: 89%</p>
</div>
</div>

<div class="col-md-3">
<div class="card bg-light">
<h5>KNN</h5>
<p>Accuracy: 85%</p>
</div>
</div>

</div>

<!-- 📊 DATASET TABLE -->
<div class="card p-3">
<h4>Dataset Preview</h4>
<div style="overflow-x:auto;">
{{ table|safe }}
</div>
</div>

</div>
</body>
</html>
