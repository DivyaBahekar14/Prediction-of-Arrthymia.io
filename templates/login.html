<!DOCTYPE html>
<html>
<head>
    <title>Login - Arrhythmia System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0d47a1; color: white; font-family: Arial; }
        .container { max-width: 400px; margin-top: 100px; }
        .card { background: rgba(255,255,255,0.95); color: black; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card p-4">
            <h3 class="text-center mb-4">Login</h3>
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="alert alert-warning">{{ messages[0] }}</div>
                {% endif %}
            {% endwith %}
            <form method="POST">
                <div class="mb-3">
                    <input type="text" class="form-control" name="username" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" name="password" placeholder="Password" required>
                </div>
                <button class="btn btn-primary w-100">Login</button>
            </form>
            <p class="text-center mt-3">
                <a href="{{url_for('register')}}" class="text-decoration-none">Register New Account</a> | 
                <a href="{{url_for('home')}}" class="text-decoration-none">Home</a>
            </p>
        </div>
    </div>
</body>
</html>
